name: Contract Tests

on:
  pull_request:
    branches: [master, rilis-dev, dev, bug-fix]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contract-tests:
    name: Validate OpenSID request payloads vs OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Validate OpenAPI Spec
        run: php bin/validate-openapi.php

      - name: Run Contract Tests
        run: php vendor/bin/pest tests/Contract --group=contract
