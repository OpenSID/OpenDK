openapi: 3.0.3
info:
  title: 'OpenDK Kecamatan API Documentation'
  description: 'API publik dan internal OpenDK untuk integrasi dengan OpenSID.'
  version: 1.0.0
  x-logo:
    url: 'https://opendk.my.id/favicon.ico'
    altText: 'OpenDK Logo'
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Anda dapat memperoleh API key dari halaman pengaturan OpenDK. Key dikirim sebagai Bearer token di header Authorization.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Get a JWT via given credentials.'
      operationId: getAJWTViaGivenCredentials
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Isian value harus berupa alamat surel yang valid.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log the user out (Invalidate the token).'
      operationId: logTheUserOutInvalidateTheToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh a token.'
      operationId: refreshAToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Get the authenticated User.'
      operationId: getTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/test:
    get:
      summary: ''
      operationId: getApiV1Test
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/penduduk:
    post:
      summary: 'Hapus Data Penduduk Sesuai OpenSID'
      operationId: hapusDataPendudukSesuaiOpenSID
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hapus_penduduk:
                  type: array
                  description: ''
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      id_pend_desa:
                        type: integer
                        description: ''
                        example: 16
                      foto:
                        type: string
                        description: ''
                        example: null
                        nullable: true
                      desa_id:
                        type: string
                        description: 'Must match an existing stored value.'
                        example: architecto
      security: []
  /api/v1/penduduk/storedata:
    post:
      summary: 'Tambah dan Ubah Data dan Foto Penduduk Sesuai OpenSID'
      operationId: tambahDanUbahDataDanFotoPendudukSesuaiOpenSID
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Must be a file. Isian value seharusnya tidak lebih dari 5120 kilobytes.'
      security: []
  /api/v1/pesan:
    post:
      summary: ''
      operationId: postApiV1Pesan
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pesan:
                  type: string
                  description: ''
                  example: architecto
                judul:
                  type: string
                  description: ''
                  example: architecto
                kode_desa:
                  type: string
                  description: 'Isian value harus minimal 13 karakter. Isian value seharusnya tidak lebih dari 13 karakter.'
                  example: ng
              required:
                - pesan
                - judul
                - kode_desa
      security: []
  /api/v1/pesan/getpesan:
    post:
      summary: ''
      operationId: postApiV1PesanGetpesan
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kode_desa:
                  type: string
                  description: 'Isian value harus minimal 13 karakter. Isian value seharusnya tidak lebih dari 13 karakter.'
                  example: bn
              required:
                - kode_desa
      security: []
  /api/v1/pesan/detail:
    get:
      summary: ''
      operationId: getApiV1PesanDetail
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      security: []
  /api/v1/identitas-desa:
    post:
      summary: ''
      operationId: postApiV1IdentitasDesa
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kode_desa:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                sebutan_desa:
                  type: string
                  description: ''
                  example: architecto
                website:
                  type: string
                  description: 'Must be a valid URL.'
                  example: 'http://bailey.com/'
                path:
                  type: string
                  description: ''
                  example: architecto
              required:
                - sebutan_desa
                - path
      security: []
  /api/v1/surat:
    get:
      summary: index
      operationId: index
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desa_id:
                  type: string
                  description: ''
                  example: architecto
              required:
                - desa_id
      security: []
  /api/v1/surat/kirim:
    post:
      summary: store
      operationId: store
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desa_id:
                  type: string
                  description: ''
                  example: architecto
                nik:
                  type: string
                  description: 'Isian value harus berupa angka sebanyak 16 digit.'
                  example: '8225697757449171'
                tanggal:
                  type: string
                  description: 'Isian value bukan tanggal yang valid.'
                  example: '2026-07-20T07:33:14'
                nomor:
                  type: string
                  description: ''
                  example: architecto
                nama:
                  type: string
                  description: ''
                  example: architecto
                file:
                  type: string
                  description: ''
                  example: null
              required:
                - desa_id
                - nik
                - tanggal
                - nomor
                - nama
      security: []
  /api/v1/surat/download:
    get:
      summary: index
      operationId: index
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                desa_id:
                  type: string
                  description: ''
                  example: architecto
                nomor:
                  type: string
                  description: ''
                  example: architecto
              required:
                - desa_id
                - nomor
      security: []
  /api/frontend/v1/artikel:
    get:
      summary: 'Display a listing of articles with advanced filtering and sorting.'
      operationId: displayAListingOfArticlesWithAdvancedFilteringAndSorting
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      security: []
  '/api/frontend/v1/artikel/{id}/comments':
    post:
      summary: 'Store a new comment for an article.'
      operationId: storeANewCommentForAnArticle
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  description: 'Isian value seharusnya tidak lebih dari 191 karakter.'
                  example: b
                email:
                  type: string
                  description: 'Isian value harus berupa alamat surel yang valid. Isian value seharusnya tidak lebih dari 191 karakter.'
                  example: zbailey@example.net
                  nullable: true
                body:
                  type: string
                  description: ''
                  example: architecto
                comment_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
              required:
                - nama
                - body
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the artikel.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/frontend/v1/artikel/cache/{prefix}':
    delete:
      summary: 'Remove all cache entries with the specified prefix'
      operationId: removeAllCacheEntriesWithTheSpecifiedPrefix
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: prefix
        description: 'Optional parameter.'
        required: true
        schema:
          type: string
        examples:
          omitted:
            summary: 'When the value is omitted'
            value: ''
          present:
            summary: 'When the value is present'
            value: architecto
  /api/frontend/v1/kategori:
    get:
      summary: 'Display a listing of articles with advanced filtering and sorting.'
      operationId: displayAListingOfArticlesWithAdvancedFilteringAndSorting
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      security: []
  '/api/frontend/v1/kategori/cache/{prefix}':
    delete:
      summary: 'Remove all cache entries with the specified prefix'
      operationId: removeAllCacheEntriesWithTheSpecifiedPrefix
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: prefix
        description: 'Optional parameter.'
        required: true
        schema:
          type: string
        examples:
          omitted:
            summary: 'When the value is omitted'
            value: ''
          present:
            summary: 'When the value is present'
            value: architecto
