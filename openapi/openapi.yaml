openapi: 3.0.3
info:
  title: 'OpenDK Kecamatan API Documentation'
  description: 'API publik dan internal OpenDK untuk integrasi dengan OpenSID.'
  version: 1.0.0
  x-logo:
    url: 'https://opendk.my.id/favicon.ico'
    altText: 'OpenDK Logo'
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Autentikasi
    description: "\nEndpoint untuk login, logout, refresh token JWT, dan informasi user."
  -
    name: Endpoints
    description: ''
  -
    name: 'OpenSID Integration'
    description: ''
  -
    name: Prosedur
    description: ''
  -
    name: 'Statistik Penduduk'
    description: ''
  -
    name: Website
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Anda dapat memperoleh API key dari halaman pengaturan OpenDK. Key dikirim sebagai Bearer token di header Authorization.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Mendapatkan JWT token dengan credentials email dan password.\nHanya user dengan permission `access.data`, `access.api`, atau `access.setting` yang diizinkan."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1Qi...
                  token_type: bearer
                  expires_in: 3600
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1Qi...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Pengguna tidak dikenali'
                properties:
                  message:
                    type: string
                    example: 'Pengguna tidak dikenali'
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email pengguna.'
                  example: admin@mail.com
                password:
                  type: string
                  description: 'Password pengguna.'
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log the user out (Invalidate the token).'
      operationId: logTheUserOutInvalidateTheToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh a token.'
      operationId: refreshAToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Get the authenticated User.'
      operationId: getTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Autentikasi
      security: []
  /api/v1/test:
    get:
      summary: ''
      operationId: getApiV1Test
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/penduduk/storedata:
    post:
      summary: 'Tambah dan Ubah Data dan Foto Penduduk Sesuai OpenSID'
      operationId: tambahDanUbahDataDanFotoPendudukSesuaiOpenSID
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Must be a file. Isian value seharusnya tidak lebih dari 5120 kilobytes.'
      security: []
  /api/v1/penduduk/test:
    post:
      summary: 'Test endpoint untuk verifikasi API berjalan.'
      operationId: testEndpointUntukVerifikasiAPIBerjalan
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/v1/pembangunan:
    post:
      summary: 'Tambah Data Pembangunan Sesuai OpenSID'
      operationId: tambahDataPembangunanSesuaiOpenSID
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Must be a file. Isian value seharusnya tidak lebih dari 5120 kilobytes.'
                desa_id:
                  type: string
                  description: ''
                  example: architecto
              required:
                - desa_id
      security: []
